name: Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install FFmpeg for tests
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - run: npm test
      - run: npm run dist:win
      - name: Verify two launches of the packaged Windows application
        shell: pwsh
        run: |
          $env:STUDIO_STARTUP_CHECK_DIR = Join-Path $env:RUNNER_TEMP 'studio-startup-check'
          $exe = Join-Path $pwd 'release/win-unpacked/Classical Recording Studio.exe'
          foreach ($launch in 1, 2) {
            $process = Start-Process -FilePath $exe -ArgumentList '--startup-check' -PassThru
            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw "Launch $launch timed out"
            }
            if ($process.ExitCode -ne 0) {
              $report = Join-Path $env:STUDIO_STARTUP_CHECK_DIR 'startup-error.log'
              if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
              throw "Launch $launch failed ($($process.ExitCode))"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Classical-Recording-Studio-Windows-x64
          path: release/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Classical-Recording-Studio-Windows-x64
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.exe --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
