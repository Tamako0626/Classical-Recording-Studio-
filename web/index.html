<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f9">
  <title>古典录音工作台</title>
  <meta name="description" content="管理古典音乐现场录音、分轨、专辑标签、封面和处理记录。">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="#projects"><span class="brand-icon" aria-hidden="true">♫</span><span>古典录音工作台<small>CLASSICAL RECORDINGS</small></span></a>
    <nav aria-label="工作区">
      <div class="nav-label">工作区</div>
      <a data-nav="projects" href="#projects"><span aria-hidden="true">▤</span>录音项目</a>
      <a data-nav="splitter" href="#splitter"><span aria-hidden="true">✂</span>整场录音分轨</a>
      <a data-nav="scripts" href="#scripts"><span aria-hidden="true">›_</span>脚本生成</a>
      <a data-nav="history" href="#history"><span aria-hidden="true">◷</span>处理记录</a>
      <a data-nav="templates" href="#templates"><span aria-hidden="true">▧</span>模板与命名</a>
    </nav>
    <div class="sidebar-bottom"><span class="sync-dot"></span><div id="sync" role="status">正在加载工作区</div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="crumb"><span>工作区</span><b>/</b><strong id="crumb">录音项目</strong></div><div class="tools"><button class="button quiet" id="llm-settings" hidden>LLM 配置</button><button class="button quiet" id="llm-files" hidden>模型识别文件</button><button class="button quiet" id="backup">↓ <span>导出备份</span></button><button class="button quiet" id="restore">↑ <span>导入备份</span></button></div></header>
    <main id="main" tabindex="-1"><div class="loading">正在加载录音项目…</div></main>
  </div>
</div>
<dialog id="dialog"></dialog>
<input type="file" id="file-input" accept=".json,.jsonl" hidden>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
